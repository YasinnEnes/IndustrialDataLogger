<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial IoT & PLC Canlı İzleme</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F2F2EB;
        }

        .sidebar {
            min-height: 100vh;
            background: #261311;
            color: #fff;
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .main-content {
            margin-left: 260px;
            padding: 30px;
        }

        .sidebar a {
            color: #d6c5c2;
            text-decoration: none;
            padding: 12px 20px;
            display: block;
            border-radius: 8px;
            margin: 4px 10px;
            transition: all 0.3s;
        }

            .sidebar a:hover, .sidebar a.active {
                background: #ba6a36;
                color: #fff;
            }

        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            background-color: #ffffff;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: relative;
                min-height: auto;
            }

            .main-content {
                margin-left: 0;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container-fluid p-0">
        <!-- Sol Menü & PLC Bağlantı Paneli -->
        <div class="sidebar d-none d-md-block p-3">
            <div>
                <h4 class="text-white text-center py-3 mb-4 border-bottom border-secondary">
                    <i class="fa-solid fa-industry text-warning me-2"></i>IoT Panel
                </h4>
                <nav>
                    <a href="index.html" class="active"><i class="fa-solid fa-chart-line me-2"></i> Canlı İzleme</a>
                    <a href="control.html"><i class="fa-solid fa-sliders me-2"></i> PLC Komut</a>
                </nav>
            </div>

            <!-- Sol Panel Alt Kısım: PLC Bağlantı Kontrol Sekmesi -->
            <div class="p-3 bg-black bg-opacity-25 rounded-3 mb-2 border border-secondary border-opacity-25">
                <h6 class="text-warning mb-2 fs-6"><i class="fa-solid fa-network-wired me-1"></i> PLC Bağlantı Yönetimi</h6>
                <div class="mb-2">
                    <span id="left-conn-status" class="badge bg-secondary w-100 p-2 text-start"><i class="fa-solid fa-circle-dot me-1"></i> Durum Bekleniyor...</span>
                </div>
                <div class="d-grid gap-1">
                    <button onclick="checkPlcConnection()" class="btn btn-outline-light btn-sm text-start"><i class="fa-solid fa-rotate me-1"></i> Bağlantıyı Test Et</button>
                    <button onclick="managePlcConnection('connect')" class="btn btn-success btn-sm text-start"><i class="fa-solid fa-plug me-1"></i> Bağlan</button>
                    <button onclick="managePlcConnection('disconnect')" class="btn btn-danger btn-sm text-start"><i class="fa-solid fa-power-off me-1"></i> Bağlantıyı Kes</button>
                </div>
            </div>
        </div>

        <!-- Ana İçerik -->
        <div class="main-content">

            <!-- Web Üzerinde Çıkacak Hata / Bilgilendirme Banner Alanı -->
            <div id="alert-banner" class="alert alert-danger d-none shadow-sm mb-4" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-2"></i> <span id="alert-message">Bağlantı hatası oluştu!</span>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 style="color: #261311;">Endüstriyel Canlı İzleme Paneli</h2>

                <div class="d-flex align-items-center">
                    <!-- Mod Değiştirme Switch Butonu -->
                    <div class="form-check form-switch me-4">
                        <input class="form-check-input" type="checkbox" id="modeSwitch" checked style="width: 3em; height: 1.5em; cursor: pointer;">
                        <label class="form-check-label fw-bold ms-2 mt-1" id="modeLabel" for="modeSwitch" style="color: #261311;">Simülasyon Modu</label>
                    </div>
                    <!-- Üst Durum Rozeti -->
                    <span id="connection-status" class="badge bg-secondary p-2"><i class="fa-solid fa-circle-dot me-1"></i> Kontrol Ediliyor...</span>
                </div>
            </div>

            <!-- Anlık Metrik Kartları -->
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="card card-custom p-3">
                        <h6 class="text-muted mb-1">Anlık Sıcaklık</h6>
                        <div class="metric-value text-danger" id="temp-val">0.0 °C</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card card-custom p-3">
                        <h6 class="text-muted mb-1">Anlık Basınç</h6>
                        <div class="metric-value text-primary" id="pressure-val">0.0 bar</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card card-custom p-3">
                        <h6 class="text-muted mb-1">Makine Durumu</h6>
                        <div class="metric-value" id="status-val">---</div>
                    </div>
                </div>
            </div>

            <!-- Grafik Alanları -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="card card-custom p-4">
                        <h5 class="mb-3 text-danger"><i class="fa-solid fa-temperature-three-quarters me-2"></i>Sıcaklık Takibi</h5>
                        <canvas id="tempChart" height="280"></canvas>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card card-custom p-4">
                        <h5 class="mb-3 text-primary"><i class="fa-solid fa-gauge-high me-2"></i>Basınç Takibi</h5>
                        <canvas id="pressureChart" height="280"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript & Kontrol Kodları -->
    <script>
        // Kullanıcının manuel olarak bağlantıyı kesip kesmediğini tutan kilit değişkeni
        let isUserDisconnected = false;

        function showAlert(msg) {
            let banner = document.getElementById('alert-banner');
            let msgSpan = document.getElementById('alert-message');
            msgSpan.innerText = msg;
            banner.classList.remove('d-none');
        }

        function hideAlert() {
            let banner = document.getElementById('alert-banner');
            banner.classList.add('d-none');
        }

        async function checkMode() {
            try {
                let res = await fetch('http://localhost:5000/api/Sensor/mode');
                if (res.ok) {
                    let data = await res.json();
                    let sw = document.getElementById('modeSwitch');
                    let lbl = document.getElementById('modeLabel');
                    sw.checked = data.isSimulation;
                    lbl.innerText = data.isSimulation ? "Simülasyon Modu" : "Gerçek Sensör Modu";
                }
            } catch (e) { console.error("Mod alınamadı"); }
        }
        checkMode();

        document.getElementById('modeSwitch').addEventListener('change', async function () {
            let isSim = this.checked;
            let lbl = document.getElementById('modeLabel');
            try {
                let res = await fetch('http://localhost:5000/api/Sensor/mode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isSimulation: isSim })
                });
                if (res.ok) {
                    lbl.innerText = isSim ? "Simülasyon Modu" : "Gerçek Sensör Modu";
                    hideAlert();
                }
            } catch (e) { console.error("Mod değiştirilemedi"); }
        });

        async function checkPlcConnection() {
            if (isUserDisconnected) {
                alert("Bağlantı manuel olarak kapalı. Lütfen önce 'Bağlan' butonuna basın.");
                return;
            }
            try {
                let res = await fetch('http://localhost:5000/api/Sensor/connection-status');
                if (res.ok) {
                    let data = await res.json();
                    if (data.isConnected) {
                        alert("PLC Bağlantısı Başarılı ve Aktif!");
                        hideAlert();
                    } else {
                        alert("Uyarı: PLC'ye bağlı değil!");
                    }
                }
            } catch (e) { alert("Sunucuya erişilemiyor!"); }
        }

        async function managePlcConnection(action) {
            if (action === 'connect') {
                isUserDisconnected = false; // Kilidi aç
            }

            try {
                let res = await fetch(`http://localhost:5000/api/Sensor/${action}`, { method: 'POST' });
                if (res.ok) {
                    let data = await res.json();
                    alert(data.message || "İşlem başarılı.");

                    if (action === 'disconnect') {
                        isUserDisconnected = true; // KİLİTLE: Kullanıcı manuel kesti
                        forceClearUI();
                    }

                    fetchLatestData();
                } else {
                    alert("İşlem gerçekleştirilemedi.");
                }
            } catch (e) {
                alert("Bağlantı hatası oluştu!");
            }
        }

        const tempCtx = document.getElementById('tempChart').getContext('2d');
        const tempChart = new Chart(tempCtx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Sıcaklık (°C)', data: [], borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.1)', fill: true, tension: 0.3 }] },
            options: { responsive: true, scales: { y: { beginAtZero: false } } }
        });

        const pressCtx = document.getElementById('pressureChart').getContext('2d');
        const pressureChart = new Chart(pressCtx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Basınç (bar)', data: [], borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.3 }] },
            options: { responsive: true, scales: { y: { beginAtZero: true } } }
        });

        function forceClearUI() {
            let badge = document.getElementById('connection-status');
            let leftBadge = document.getElementById('left-conn-status');

            badge.className = "badge bg-danger p-2";
            badge.innerHTML = '<i class="fa-solid fa-triangle-exclamation me-1"></i> PLC Bağlı Değil';
            leftBadge.className = "badge bg-danger w-100 p-2 text-start";
            leftBadge.innerHTML = '<i class="fa-solid fa-triangle-exclamation me-1"></i> Bağlantı Yok';

            document.getElementById('temp-val').innerText = "0.0 °C";
            document.getElementById('pressure-val').innerText = "0.0 bar";
            let statusEl = document.getElementById('status-val');
            statusEl.innerText = "DURDU";
            statusEl.className = "metric-value text-danger";

            tempChart.data.labels = [];
            tempChart.data.datasets[0].data = [];
            tempChart.update();

            pressureChart.data.labels = [];
            pressureChart.data.datasets[0].data = [];
            pressureChart.update();
        }

        async function fetchLatestData() {
            if (isUserDisconnected) {
                forceClearUI();
                return;
            }

            try {
                let statusRes = await fetch('http://localhost:5000/api/Sensor/connection-status');
                if (!statusRes.ok) return;

                let statusData = await statusRes.json();
                let isConnected = statusData.isConnected;

                if (!isConnected || isUserDisconnected) {
                    forceClearUI();
                    return;
                }

                let badge = document.getElementById('connection-status');
                let leftBadge = document.getElementById('left-conn-status');
                badge.className = "badge bg-success p-2";
                badge.innerHTML = '<i class="fa-solid fa-circle-dot me-1"></i> PLC Bağlı';
                leftBadge.className = "badge bg-success w-100 p-2 text-start";
                leftBadge.innerHTML = '<i class="fa-solid fa-circle-check me-1"></i> Bağlantı Aktif';
                hideAlert();

                let response = await fetch('http://localhost:5000/api/Sensor/latest');
                if (response.ok) {
                    let data = await response.json();
                    if (!data || data.temperature === undefined) return;

                    document.getElementById('temp-val').innerText = data.temperature + " °C";
                    document.getElementById('pressure-val').innerText = data.pressure + " bar";

                    let statusEl = document.getElementById('status-val');
                    statusEl.innerText = data.machineStatus ? "ÇALIŞIYOR" : "DURDU";
                    statusEl.className = data.machineStatus ? "metric-value text-success" : "metric-value text-danger";

                    let timeNow = new Date().toLocaleTimeString();
                    if (tempChart.data.labels.length > 20) {
                        tempChart.data.labels.shift();
                        tempChart.data.datasets[0].data.shift();
                        pressureChart.data.labels.shift();
                        pressureChart.data.datasets[0].data.shift();
                    }
                    tempChart.data.labels.push(timeNow);
                    tempChart.data.datasets[0].data.push(data.temperature);
                    pressureChart.data.labels.push(timeNow);
                    pressureChart.data.datasets[0].data.push(data.pressure);

                    tempChart.update();
                    pressureChart.update();
                }
            } catch (error) {
                console.error("Sunucu iletişim hatası:", error);
            }
        }

        setInterval(fetchLatestData, 2000);
        fetchLatestData();
    </script>
</body>
</html>
