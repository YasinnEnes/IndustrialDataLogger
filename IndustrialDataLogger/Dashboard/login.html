<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - IoT Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #FFD6A5; /* Yeni arka plan rengi */
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Dalga Efekti Konumlandırma */
        .wave-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 160px;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg"><path d="M0,20 C150,110 350,-10 500,50 C650,110 900,10 1200,40 L1200,120 L0,120 Z" fill="%235B3D2E"/></svg>') repeat-x;
            background-size: 50% 100%;
        }

        /* Dalgaların akış animasyonları ve belirginlikleri */
        .wave1 {
            animation: waveAnimation 10s linear infinite;
            z-index: 2;
            opacity: 0.85; /* Daha net ve belirgin */
        }

        .wave2 {
            animation: waveAnimation 6s linear infinite reverse;
            bottom: 12px;
            z-index: 1;
            opacity: 0.45; /* Derinlik hissi veren ikinci katman */
        }

        @keyframes waveAnimation {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        /* İçerik Kartı */
        .login-container {
            display: flex;
            align-items: center;
            gap: 50px;
            z-index: 10;
            position: relative;
        }

        .login-card {
            background: #ffffff;
            padding: 30px 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px -4px rgba(91, 61, 46, 0.25);
            width: 360px;
        }

            .login-card h3 {
                color: #261311;
                font-weight: 600;
                font-size: 1.35rem;
                margin-bottom: 20px;
                text-align: center;
            }

        .form-label {
            font-weight: 400;
            font-size: 12px;
        }

        .form-control {
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-custom {
            background-color: #635d56;
            color: white;
            font-weight: 500;
            padding: 9px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            transition: all 0.3s;
        }

            .btn-custom:hover {
                background-color: #4e4943;
                color: white;
            }

        /* Karakter Stilleri */
        .character-box {
            width: 140px;
            text-align: center;
        }

        .character-svg {
            width: 120px;
            height: 120px;
        }

        .eye {
            transition: all 0.2s ease;
        }
    </style>
</head>
<body>

    <!-- Arka Plan Belirgin Dalga Efekti -->
    <div class="wave-container">
        <div class="wave wave1"></div>
        <div class="wave wave2"></div>
    </div>

    <div class="login-container">
        <!-- Hareketli Karakter -->
        <div class="character-box">
            <svg class="character-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <rect x="50" y="70" width="100" height="90" rx="20" fill="#261311" />
                <rect x="70" y="40" width="60" height="35" rx="10" fill="#635d56" />

                <line x1="100" y1="40" x2="100" y2="20" stroke="#635d56" stroke-width="6" stroke-linecap="round" />
                <circle cx="100" cy="15" r="6" fill="#e0a96d" />

                <rect x="62" y="85" width="76" height="50" rx="10" fill="#F2F2EB" />

                <g id="eyes">
                    <circle id="left-eye" class="eye" cx="85" cy="110" r="8" fill="#261311" />
                    <circle id="right-eye" class="eye" cx="115" cy="110" r="8" fill="#261311" />
                </g>

                <g id="hands" transform="translate(0, 20)">
                    <path id="left-hand" d="M 50 120 Q 40 100 65 95" fill="none" stroke="#635d56" stroke-width="8" stroke-linecap="round" style="transition: transform 0.3s;" />
                    <path id="right-hand" d="M 150 120 Q 160 100 135 95" fill="none" stroke="#635d56" stroke-width="8" stroke-linecap="round" style="transition: transform 0.3s;" />
                </g>

                <circle cx="100" cy="150" r="5" fill="#2ecc71" />
            </svg>
            <!-- Açık arka planda yazının net okunması için renk tonu ayarlandı -->
            <div id="char-text" class="fw-semibold mt-2" style="font-size: 13px; color: #5B3D2E;">Sizi Bekliyor...</div>
        </div>

        <!-- Giriş Kartı -->
        <div class="login-card">
            <h3><i class="fa-solid fa-industry text-warning me-2"></i>IoT Panel Giriş</h3>

            <div id="error-alert" class="alert alert-danger d-none py-2 mb-3 text-center" style="font-size: 12px;"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label text-muted">Kullanıcı Adı</label>
                    <input type="text" id="username" class="form-control" required placeholder="programci veya musteri">
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">Şifre</label>
                    <input type="password" id="password" class="form-control" required placeholder="******">
                </div>
                <button type="submit" class="btn btn-custom w-100 py-2">Giriş Yap</button>
            </form>
        </div>
    </div>

    <script>
        if (sessionStorage.getItem('token')) {
            window.location.replace('index.html');
        }

        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const leftEye = document.getElementById('left-eye');
        const rightEye = document.getElementById('right-eye');
        const leftHand = document.getElementById('left-hand');
        const rightHand = document.getElementById('right-hand');
        const charText = document.getElementById('char-text');

        usernameInput.addEventListener('focus', () => {
            leftEye.setAttribute('cx', '81');
            rightEye.setAttribute('cx', '111');
            charText.innerText = "Kullanıcı Adı Giriliyor...";
        });

        usernameInput.addEventListener('blur', () => {
            leftEye.setAttribute('cx', '85');
            rightEye.setAttribute('cx', '115');
            charText.innerText = "Sizi Bekliyor...";
        });

        passwordInput.addEventListener('focus', () => {
            leftEye.setAttribute('cy', '115');
            rightEye.setAttribute('cy', '115');
            leftHand.setAttribute('d', 'M 50 110 Q 65 95 85 105');
            rightHand.setAttribute('d', 'M 150 110 Q 135 95 115 105');
            charText.innerText = "Şifre Gizleniyor!";
        });

        passwordInput.addEventListener('blur', () => {
            leftEye.setAttribute('cy', '110');
            rightEye.setAttribute('cy', '110');
            leftHand.setAttribute('d', 'M 50 120 Q 40 100 65 95');
            rightHand.setAttribute('d', 'M 150 120 Q 160 100 135 95');
            charText.innerText = "Sizi Bekliyor...";
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            const errorAlert = document.getElementById('error-alert');

            try {
                const res = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    let roleDisplay = data.role === 'Admin' || data.role === 'Programmer' ? 'Programcı' : 'Müşteri';
                    sessionStorage.setItem('jwtToken', data.token);
                    sessionStorage.setItem('token', data.token);
                    sessionStorage.setItem('userRole', roleDisplay);
                    sessionStorage.setItem('roleKey', data.role);
                    sessionStorage.setItem('username', data.username);

                    charText.innerText = "Giriş Başarılı!";
                    setTimeout(() => {
                        window.location.replace('index.html');
                    }, 400);
                } else {
                    errorAlert.innerText = data.message || "Geçersiz kullanıcı adı veya şifre!";
                    errorAlert.classList.remove('d-none');
                    charText.innerText = "Hatalı Giriş!";
                }
            } catch (err) {
                // Yerel fallback
                if ((username === 'programci' || username === 'admin') && (password === 'admin123' || password === 'prog123')) {
                    sessionStorage.setItem('token', 'local-token-admin');
                    sessionStorage.setItem('userRole', 'Programcı');
                    sessionStorage.setItem('username', username);
                    window.location.replace('index.html');
                } else if ((username === 'musteri' || username === 'operator') && (password === 'user123' || password === 'op123')) {
                    sessionStorage.setItem('token', 'local-token-user');
                    sessionStorage.setItem('userRole', 'Müşteri');
                    sessionStorage.setItem('username', username);
                    window.location.replace('index.html');
                } else {
                    errorAlert.innerText = "Sunucuya erişilemedi veya bilgiler hatalı!";
                    errorAlert.classList.remove('d-none');
                    charText.innerText = "Hatalı Giriş!";
                }
            }
        });
    </script>
</body>
</html>
