<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLC Komut Paneli</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9edf0;
        }
        /* Blush Arka Plan */
        .sidebar {
            min-height: 100vh;
            background: #261311;
            color: #fff;
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            z-index: 1000;
        }
        /* Espresso Panel */
        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

        .sidebar a {
            color: #d6c5c2;
            text-decoration: none;
            padding: 12px 20px;
            display: block;
            border-radius: 8px;
            margin: 4px 10px;
            transition: all 0.3s;
        }

            .sidebar a:hover, .sidebar a.active {
                background: #ba6a36;
                color: #fff;
            }
        /* Amber Vurgu */
        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            background-color: #ffffff;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: relative;
                min-height: auto;
            }

            .main-content {
                margin-left: 0;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container-fluid p-0">
        <!-- Sol Menü -->
        <div class="sidebar d-none d-md-block p-3">
            <h4 class="text-white text-center py-3 mb-4 border-bottom border-secondary">
                <i class="fa-solid fa-industry text-warning me-2"></i>IoT Panel
            </h4>
            <nav>
                <a href="index.html"><i class="fa-solid fa-chart-line me-2"></i> Canlı İzleme</a>
                <a href="control.html" class="active"><i class="fa-solid fa-sliders me-2"></i> PLC Komut</a>
            </nav>
        </div>

        <!-- Ana İçerik -->
        <div class="main-content">
            <h2 class="mb-4" style="color: #261311;">PLC Komut ve Veri Yazma Paneli</h2>

            <div class="card card-custom p-4" style="max-width: 600px;">
                <h5 class="mb-3" style="color: #ba6a36;"><i class="fa-solid fa-terminal me-2"></i>PLC'ye Veri Yaz (Komut Gönder)</h5>

                <form id="plcForm">
                    <div class="mb-3">
                        <label for="variableName" class="form-label fw-bold text-muted">Değişken Adı (Tag / Adres)</label>
                        <input type="text" class="form-control" id="variableName" placeholder="Örn: DB1.DBX0.0 veya DB1.DBW2" required>
                    </div>
                    <div class="mb-3">
                        <label for="variableValue" class="form-label fw-bold text-muted">Gönderilecek Değer</label>
                        <input type="text" class="form-control" id="variableValue" placeholder="Örn: true, false veya 50" required>
                    </div>
                    <button type="submit" class="btn text-white w-100 py-2 fw-bold" style="background-color: #ba6a36;"><i class="fa-solid fa-paper-plane me-2"></i>Komutu Gönder</button>
                </form>
                <div id="resultMessage" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('plcForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            let varName = document.getElementById('variableName').value;
            let varVal = document.getElementById('variableValue').value;

            // Tip dönüştürme (Boolean veya Sayısal)
            let parsedVal = varVal;
            if (varVal.toLowerCase() === 'true') parsedVal = true;
            else if (varVal.toLowerCase() === 'false') parsedVal = false;
            else if (!isNaN(varVal)) parsedVal = Number(varVal);

            try {
                let response = await fetch('http://localhost:5000/api/Sensor/write', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ VariableName: varName, Value: parsedVal })
                });

                let msgDiv = document.getElementById('resultMessage');
                if (response.ok) {
                    msgDiv.innerHTML = `<div class="alert alert-success">Komut başarıyla PLC'ye gönderildi!</div>`;
                } else {
                    msgDiv.innerHTML = `<div class="alert alert-danger">Komut gönderilemedi! Hata oluştu.</div>`;
                }
            } catch (error) {
                document.getElementById('resultMessage').innerHTML = `<div class="alert alert-danger">Bağlantı hatası! API çalışıyor mu?</div>`;
            }
        });
    </script>
</body>
</html>
