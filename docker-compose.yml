version: '3.8'

services:
  # 1. PostgreSQL Veritabanı Servisi
  postgres:
    image: postgres:16-alpine
    container_name: industrial_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password_1234
      POSTGRES_DB: IndustrialDataDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d IndustrialDataDB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - industrial_net

  # 2. Industrial IoT & Digital Twin Backend Servisi (.NET 10 + SignalR)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: industrial_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=5000
      - POSTGRES_CONNECTION_STRING=Host=postgres;Port=5432;Database=IndustrialDataDB;Username=postgres;Password=postgres_secure_password_1234
      - JWT_SECRET=IndustrialDataLogger_Production_SuperSecret_Jwt_Key_2026_Secure_998877
    ports:
      - "5000:5000"
    networks:
      - industrial_net

volumes:
  postgres_data:
    driver: local

networks:
  industrial_net:
    driver: bridge
