version: '3.8'

services:
  # 1. PostgreSQL 16 Zaman Serisi & İlişkisel Veritabanı
  postgres:
    image: postgres:16-alpine
    container_name: industrial_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_1234}
      POSTGRES_DB: ${POSTGRES_DB:-IndustrialDataDB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-IndustrialDataDB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - industrial_net

  # 2. Industrial IoT, SignalR Hub & Web Dashboard (.NET 10)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: industrial_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - PORT=${PORT:-5000}
      - POSTGRES_CONNECTION_STRING=Host=postgres;Port=5432;Database=${POSTGRES_DB:-IndustrialDataDB};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_secure_password_1234}
      - JWT_SECRET=${JWT_SECRET:-IndustrialDataLogger_Production_SuperSecret_Jwt_Key_2026_Secure_998877}
      - UseMockPlc=${USE_MOCK_PLC:-true}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - industrial_net

  # 3. Opsiyonel pgAdmin Veritabanı Yönetim Paneli (Profile: tools)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: industrial_pgadmin
    restart: unless-stopped
    profiles: ["tools", "debug"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@industrial.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - industrial_net

volumes:
  postgres_data:
    driver: local

networks:
  industrial_net:
    driver: bridge
